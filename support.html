<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dash Log · Login Support</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/themes.css"><style>body{min-height:100dvh;background:#0b100e;color:#f4e8d0;font-family:system-ui;padding:28px 16px}.public-support{max-width:540px;margin:5vh auto;background:#172019;border:1px solid #77623b;border-radius:22px;padding:26px}.public-support h1{color:#f6d999;margin:0 0 12px}.public-support label{display:grid;gap:7px;margin:15px 0}.public-support input,.public-support select,.public-support textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #77623b;background:#101715;color:#fff;font:inherit}.public-support button{background:#e7bf7d;color:#211708;border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.public-support a{color:#e7bf7d}.public-support textarea{min-height:130px}.muted{color:#bfb7a6}</style></head><body><main class="public-support"><a href="/">← Back to Dash Log</a><h1>Can't sign in?</h1><p class="muted">Tell us what happened and we'll help you regain access.</p><form id="loginSupport"><label>Email<input id="helpEmail" type="email" required maxlength="254" autocomplete="email"></label><label>Issue<select id="helpCategory"><option value="login">Can't sign in</option><option value="account">Account issue</option><option value="other">Other</option></select></label><label>Subject<input id="helpSubject" required minlength="3" maxlength="140"></label><label>Details<textarea id="helpDescription" required minlength="10" maxlength="3000"></textarea></label><div id="turnstileSlot"></div><button type="submit">Contact Support</button><p id="helpStatus" role="status"></p></form></main><script type="module" src="/public-support.js"></script></body></html>
